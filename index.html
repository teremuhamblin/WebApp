<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>WebApp Command Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSP de base (à renforcer côté serveur) -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">

    <meta name="description" content="WebApp Command Center avec contrôle des effets, performances et thème.">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <noscript>
        <div class="noscript-warning">
            Cette WebApp nécessite JavaScript pour fonctionner correctement.
        </div>
    </noscript>

    <header>
        <h1>WebApp — Command Center</h1>
        <p>Contrôle avancé de l’interface, des performances et des effets.</p>
    </header>

    <main>
        <section class="main-actions">
            <button id="primary-action">Action principale</button>
        </section>

        <section id="command-center" class="command-center" aria-label="Panneau de contrôle WebApp">
            <h2>Command Center</h2>

            <div class="cc-grid">
                <div class="cc-panel">
                    <h3>Thème & Mode</h3>
                    <button id="toggle-theme">Basculer thème (clair/sombre)</button>
                    <button id="toggle-perf">Mode performance (ON/OFF)</button>
                </div>

                <div class="cc-panel">
                    <h3>Effets visuels</h3>
                    <button id="toggle-animations">Animations (ON/OFF)</button>
                    <button id="toggle-parallax">Parallax (ON/OFF)</button>
                    <button id="toggle-glow">Glow dynamique (ON/OFF)</button>
                </div>

                <div class="cc-panel">
                    <h3>Statut système</h3>
                    <p>FPS estimé : <span id="fps-display">--</span></p>
                    <p>Scroll speed : <span id="scroll-speed-display">--</span></p>
                    <p>Perf mode : <span id="perf-status">OFF</span></p>
                </div>

                <div class="cc-panel">
                    <h3>Logs</h3>
                    <div id="log-console" class="log-console" aria-live="polite"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
